[project]
name = "qwen-tts-skill"
# 必须与 scripts/qwen_tts_skill.py 中的 __version__ 保持一致
version = "0.3.1"
description = "Independent Python skill for Qwen TTS with an optional OpenAI-style /v1/audio/speech compatibility subset"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
    "gradio_client>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
qwen-tts-skill = "qwen_tts_skill:main"

[tool.setuptools]
py-modules = ["qwen_tts_skill"]
package-dir = {"" = "scripts"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require network/external services",
]
