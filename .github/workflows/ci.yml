name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Self verification (verify.py)
        env:
          # Windows runner 控制台默认非 UTF-8，强制一致避免编码崩溃
          PYTHONIOENCODING: utf-8
        run: python verify.py

      - name: Run offline tests
        env:
          # 真实上游冒烟默认隔离，避免免费 Space 波动阻塞 PR
          QWEN_TTS_NETWORK_TESTS: "0"
          PYTHONIOENCODING: utf-8
        run: pytest tests/test_skill.py -q

      - name: Credential boundary checks
        env:
          QWEN_TTS_NETWORK_TESTS: "0"
          PYTHONIOENCODING: utf-8
        run: pytest tests/test_skill.py -q -k "CredentialBoundary or ReleaseConsistency"

  # Agent Skills 开放规范校验（skills-ref 要求 Python>=3.11，独立小 job）
  skill-spec:
    name: Agent Skills validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skills-ref (official reference validator)
        run: pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"

      - name: Validate skill structure
        run: |
          python -c "from skills_ref import validate; errors = validate('.'); assert errors == [], errors; print('skill spec: OK')"

  # 真实上游冒烟：手动触发或每日定时，不阻塞普通 PR
  network-smoke:
    name: Real upstream smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run network smoke tests
        env:
          QWEN_TTS_NETWORK_TESTS: "1"
        run: pytest tests/test_skill.py -q -k RealUpstream
